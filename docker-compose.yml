name: dream-invoice

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dream_invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dream_invoice}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - dream_invoice_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dream_invoice} -d ${POSTGRES_DB:-dream_invoice}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dream Invoice}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      DREAM_INVOICE_AUTH_USER: ${DREAM_INVOICE_AUTH_USER:-admin}
      DREAM_INVOICE_AUTH_PASSWORD: ${DREAM_INVOICE_AUTH_PASSWORD:-}
      DREAM_INVOICE_AUTH_REQUIRED: ${DREAM_INVOICE_AUTH_REQUIRED:-false}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dream_invoice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dream_invoice}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.DREAM_INVOICE_AUTH_PASSWORD; const u=process.env.DREAM_INVOICE_AUTH_USER || 'admin'; const h=p ? { authorization: 'Basic ' + Buffer.from(u + ':' + p).toString('base64') } : {}; fetch('http://127.0.0.1:3000/login', { headers: h }).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  server-worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: docker/ServerWorker.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dream_invoice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dream_invoice}
      SERVER_WORKER_MODE: ${SERVER_WORKER_MODE:-scheduled}
      SERVER_WORKER_SCHEDULE_FILE: ${SERVER_WORKER_SCHEDULE_FILE:-config/schedules.example.json}
      SERVER_WORKER_LIMIT: ${SERVER_WORKER_LIMIT:-25}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DREAM_INVOICE_AUTH_USER: ${DREAM_INVOICE_AUTH_USER:-admin}
      DREAM_INVOICE_AUTH_PASSWORD: ${DREAM_INVOICE_AUTH_PASSWORD:-}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --user=\"$$DREAM_INVOICE_AUTH_USER\" --password=\"$$DREAM_INVOICE_AUTH_PASSWORD\" -qO- http://127.0.0.1/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dream_invoice_postgres:
