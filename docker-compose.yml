name: dream-invoice-premium

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dream_invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_platform}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:55433}:5432"
    volumes:
      - dream_invoice_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dream_invoice} -d ${POSTGRES_DB:-invoice_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-app:
    image: ${DREAM_INVOICE_IMAGE:-ghcr.io/dream-de/invoice-premium:dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dream Invoice}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3012}
      DREAM_INVOICE_AUTH_USER: ${DREAM_INVOICE_AUTH_USER:-admin}
      DREAM_INVOICE_AUTH_PASSWORD: ${DREAM_INVOICE_AUTH_PASSWORD:-}
      DREAM_INVOICE_AUTH_REQUIRED: ${DREAM_INVOICE_AUTH_REQUIRED:-false}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      DREAM_INVOICE_UPLOAD_DIR: ${DREAM_INVOICE_UPLOAD_DIR:-/app/data/uploads/receipts}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dream_invoice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_platform}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ./data:/app/data
    expose:
      - "3010"
    ports:
      - "${WEB_PORT:-3012}:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.DREAM_INVOICE_AUTH_PASSWORD; const u=process.env.DREAM_INVOICE_AUTH_USER || 'admin'; const h=p ? { authorization: 'Basic ' + Buffer.from(u + ':' + p).toString('base64') } : {}; fetch('http://127.0.0.1:3010/login', { headers: h }).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    profiles:
      - proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DREAM_INVOICE_AUTH_USER: ${DREAM_INVOICE_AUTH_USER:-admin}
      DREAM_INVOICE_AUTH_PASSWORD: ${DREAM_INVOICE_AUTH_PASSWORD:-}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://127.0.0.1/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dream_invoice_postgres:
