name: Docker Images

on:
  push:
    branches:
      - dev/dreaminvoice-premium
    tags:
      - "premium-v*"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "database/**"
      - "assets/**"
      - "docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PREMIUM_IMAGE: ghcr.io/dream-de/invoice-premium

jobs:
  build:
    name: Build and publish premium image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Premium image metadata
        id: premium-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREMIUM_IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev/dreaminvoice-premium' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build premium image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.premium-meta.outputs.tags }}
          labels: ${{ steps.premium-meta.outputs.labels }}
          cache-from: type=gha,scope=premium
          cache-to: type=gha,mode=max,scope=premium
