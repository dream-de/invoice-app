name: dream-invoice-development

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DREAM_INVOICE_DEV_POSTGRES_USER:-dream_invoice}
      POSTGRES_PASSWORD: ${DREAM_INVOICE_DEV_POSTGRES_PASSWORD:-dream_invoice_dev_password}
      POSTGRES_DB: ${DREAM_INVOICE_DEV_POSTGRES_DB:-dream_invoice}
    ports:
      - "${DREAM_INVOICE_DEV_POSTGRES_PORT:-55433}:5432"
    volumes:
      - dream_invoice_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DREAM_INVOICE_DEV_POSTGRES_USER:-dream_invoice} -d ${DREAM_INVOICE_DEV_POSTGRES_DB:-dream_invoice}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${DREAM_INVOICE_MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${DREAM_INVOICE_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DREAM_INVOICE_MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - dream_invoice_dev_mailpit:/data

  adminer:
    build:
      context: ./adminer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${DREAM_INVOICE_ADMINER_PORT:-8081}:8080"

volumes:
  dream_invoice_dev_postgres:
  dream_invoice_dev_mailpit:
