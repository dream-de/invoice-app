services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoice_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  invoice-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dream Invoice}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-before-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoice_platform}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "3000"
    ports:
      - "${INVOICE_PORT:-3000}:3000"

  server-worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: docker/ServerWorker.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoice_platform}
      SERVER_WORKER_MODE: ${SERVER_WORKER_MODE:-scheduled}
      SERVER_WORKER_SCHEDULE_FILE: ${SERVER_WORKER_SCHEDULE_FILE:-config/schedules.example.json}
      SERVER_WORKER_LIMIT: ${SERVER_WORKER_LIMIT:-25}

  demo-app:
    build:
      context: ..
      dockerfile: docker/Demo.Dockerfile
    restart: unless-stopped
    expose:
      - "4173"

  landing-page:
    build:
      context: ..
      dockerfile: docker/LandingPage.Dockerfile
    restart: unless-stopped
    expose:
      - "4174"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - invoice-app
      - demo-app
      - landing-page
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  invoice_platform_postgres:
