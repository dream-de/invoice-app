name: dream-invoice

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dream_invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dream_invoice_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dream_invoice}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dream_invoice_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dream_invoice} -d ${POSTGRES_DB:-dream_invoice}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dream Invoice}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-before-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dream_invoice}:${POSTGRES_PASSWORD:-dream_invoice_dev_password}@postgres:5432/${POSTGRES_DB:-dream_invoice}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  server-worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: docker/ServerWorker.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dream_invoice}:${POSTGRES_PASSWORD:-dream_invoice_dev_password}@postgres:5432/${POSTGRES_DB:-dream_invoice}
      SERVER_WORKER_MODE: ${SERVER_WORKER_MODE:-scheduled}
      SERVER_WORKER_SCHEDULE_FILE: ${SERVER_WORKER_SCHEDULE_FILE:-config/schedules.example.json}
      SERVER_WORKER_LIMIT: ${SERVER_WORKER_LIMIT:-25}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dream_invoice_postgres:
