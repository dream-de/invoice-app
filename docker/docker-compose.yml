services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoice_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  invoice-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Invoice Platform}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-before-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoice_platform}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "${INVOICE_PORT:-3000}:3000"

volumes:
  invoice_platform_postgres:
