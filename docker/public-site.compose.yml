name: dream-invoice-public

services:
  demo-app:
    build:
      context: ..
      dockerfile: docker/Demo.Dockerfile
    restart: unless-stopped
    expose:
      - "4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  landing-page:
    build:
      context: ..
      dockerfile: docker/LandingPage.Dockerfile
    restart: unless-stopped
    expose:
      - "4174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  public-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      demo-app:
        condition: service_healthy
      landing-page:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/public-site.conf:/etc/nginx/conf.d/default.conf:ro
